name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build site
        run: bun run build
      - name: registry.json is what installs read, so it must match the components
        run: git diff --exit-code registry.json
      - name: Registry is valid
        run: bun x shadcn build -o /tmp/registry
